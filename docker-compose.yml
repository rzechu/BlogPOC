version: '3.4'

services:
  blogwebapi:
    image: ${DOCKER_REGISTRY-}blogwebapi
    build:
      context: .
      dockerfile: Blog.WebAPI/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BlogDb;User=sa;Password=Your_password123;TrustServerCertificate=true; 
    depends_on:
      - sqlserver
      - rabbitmq 

  bloguserapi:
    image: ${DOCKER_REGISTRY-}bloguserapi
    build:
      context: .
      dockerfile: Blog.UserAPI/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5672:5672"  # RabbitMQ
      - "15672:15672"  # management UI